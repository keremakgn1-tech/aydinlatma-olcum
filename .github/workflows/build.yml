name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Buildozer kur
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer "Cython==0.29.33"
          git clone https://github.com/kivy/python-for-android.git p4a-src
          python3 patch_p4a.py p4a-src/pythonforandroid/build.py

      - name: Ek Linux bagimliligi
        run: sudo apt -y install automake autoconf libtool libltdl-dev

      - name: APK derle
        run: |
          yes | buildozer android debug

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: aydinlatma-olcum-apk
          path: bin/*.apk
