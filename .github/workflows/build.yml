name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Buildozer kur
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer "Cython==0.29.33"
          git clone https://github.com/kivy/python-for-android.git p4a-src
          cd p4a-src && git checkout cda8e65d33c4851ba4e5ddcacc18041bd235c382 && cd ..

      - name: Ek Linux bagimliligi
        run: sudo apt -y install automake autoconf libtool libltdl-dev

      - name: Sabit imza anahtari (guncelleme ustune kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: APK derle
        run: |
          yes | buildozer android debug

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: aydinlatma-olcum-apk
          path: bin/*.apk

      - name: APK'yi Release olarak yayinla (son-surum)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum bin/*.apk --prerelease \
            --title "Son APK (${GITHUB_SHA::7})" \
            --notes "Otomatik derleme - commit ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
