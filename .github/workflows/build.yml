name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Buildozer kur
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython
          pip3 install --force-reinstall --no-deps git+https://github.com/kivy/python-for-android.git@master

      - name: Ek Linux bagimliligi
        run: sudo apt -y install automake autoconf libtool libltdl-dev

      - name: APK derle
        run: |
          yes | buildozer android debug

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: aydinlatma-olcum-apk
          path: bin/*.apk
