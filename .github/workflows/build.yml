name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: APK derle
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: '3.11'
          buildozer-cmd: buildozer -v android debug

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: aydinlatma-olcum-apk
          path: ./bin/*.apk
